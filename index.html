<!doctype html>
<html lang="en">
  <head>
    <title>My BCIT Project</title>
    <meta name="comp1800 template" content="My 1800 App" />

    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <!-- Top Navbar -->
    <nav class="navbar navbar-expand-sm bg-success">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">
          <img src="./images/logo.jpg" height="36" />
          Lance App
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#">Home</a>
            </li>
            <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle active"
                href="#"
                role="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                My account
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">My hike</a></li>
                <li><a class="dropdown-item" href="#">Setting</a></li>
              </ul>
            </li>
          </ul>
          <form class="d-flex" role="search">
            <input
              class="form-control me-2"
              type="search"
              placeholder="Search"
              aria-label="Search"
            />
            <button class="btn btn-outline-success" type="submit">
              Search
            </button>
          </form>
        </div>
      </div>
    </nav>
    <!-- End of Top Navbar -->

    <!-- Hero Section start-->
    <div class="px-3 py-5 my-2 text-center bg-dark-subtle">
      <img
        class="d-block mx-auto mb-4"
        src="./images/logo.jpg"
        alt=""
        width="72"
        height="57"
      />
      <h1 class="display-5 fw-bold text-body-emphasis">Let's Hike Together!</h1>
      <div class="col-lg-6 mx-auto">
        <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
          <button type="button" class="btn btn-success btn-lg px-4 gap-3">
            Explore Hikes
          </button>
          <button type="button" class="btn btn-outline-success btn-lg px-4">
            Read More
          </button>
        </div>
      </div>
    </div>
    <!-- Hero Section ends-->

    <!-- Start of card group-->
    <h1 class="mx-5 mb-4">Popular Hikes</h1>
    <div class="card-group mx-5">
      <div class="card">
        <img
          src="
https://picsum.photos/id/1/100/100
"
          class="card-img-top"
          alt="..."
        />
        <div class="card-body">
          <h5 class="card-title">Mountain Hike</h5>
          <p class="card-text">First Option</p>
          <p class="card-text">
            <small class="text-body-secondary">Last updated 3 mins ago</small>
          </p>
        </div>
      </div>
      <div class="card">
        <img
          src="https://picsum.photos/id/11/100/100"
          class="card-img-top"
          alt="..."
        />
        <div class="card-body">
          <h5 class="card-title">Beautiful Hike</h5>
          <p class="card-text">Second Opiton</p>
          <p class="card-text">
            <small class="text-body-secondary">Last updated 3 mins ago</small>
          </p>
        </div>
      </div>
      <div class="card">
        <img
          src="https://picsum.photos/id/13/100/100"
          class="card-img-top"
          alt="..."
        />
        <div class="card-body">
          <h5 class="card-title">Photo Hike</h5>
          <p class="card-text">Third Option</p>
          <p class="card-text">
            <small class="text-body-secondary">Last updated 3 mins ago</small>
          </p>
        </div>
      </div>
    </div>
    <!-- End of card group-->
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
